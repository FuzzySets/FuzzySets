<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>後手必殺ファジィ集合</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="恵庭を中心に、東京・千葉・長野・札幌・帯広・神戸・熊本・ペルー(予定)に支部を構える(2025/07現在)クリエイター集団">
<meta name="keywords" content="演劇,漫画,ラジオ,小説,動画,ファジィ">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/openclose.js"></script>
<script src="../js/fixmenu_pagetop.js"></script>
<script src="../js/include.js"></script>
</head>

<body>

<!-- Header include -->
<div id="header-container" data-page="works"></div>

<div id="contents">

<article>
	<p><a href="javascript:history.back()">&lt;&lt; 前のページに戻る</a></p>
	<h2>隣人はマジシャン<span>rinjin-ha-magician</span></h2>
	
	<!-- 以下、jsで要素繰り返し -->
	<div class="comics-grid" id="comic-container"></div>
</article>

<p><a href="javascript:history.back()">&lt;&lt; 前のページに戻る</a></p>

</div>
<!--/#contents-->

<!-- Footer include -->
<div id="footer-container"></div>

<script>
// URLからクエリを取得
const params = new URLSearchParams(window.location.search);
const episodes = params.get("episode");

if (episodes) {
	const episode_list = episodes.split("-");
	const container = document.getElementById("comic-container");
	start = Number(episode_list[0])
	end = Number(episode_list[1])
	for (let i = 0; i <= end - start; i++) {
		const div = document.createElement("div");
		div.className = "comic-item";
		div.innerHTML = `
		<img src="../images/works/comics/rinmaji/${start + i}_rnmj.jpg" alt="漫画${start + i}">
		<span class="comic-episode">${start + i}回</span>
		`;
		container.appendChild(div);
  }
}
</script>
<!-- CSS（既存のstyle.cssに追加するとよりきれいに表示できます） -->
<style>
	/* 4コマ漫画用のグリッド */
	.comics-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr); /* 横2列 */
	grid-auto-rows: auto;
	padding: 10px;
	}

	.comic-item {
	display: flex;
	align-items: flex-start;   /* 上揃え */
	margin-bottom: 50px;  /* 各アイテムの下にスペース */
	width: 100%;
	}

	.comic-item img {
	width: 70%;    /* 画像を7割、説明を3割くらいにする */
	border-radius: 4px;
	display: block;
	max-height: 600px;
	width: auto;
	}

	.comic-episode {
	flex: 1;                   /* 残りのスペースに配置 */
	font-size: 0.95rem;
	color: #333;
	margin: 0;
	padding-left: 2vh;
	}
</style>

</body>
</html>
