name: Deploy to GitHub Pages

on:
  push:
    branches: [Stage]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする（実行中のものは中断しない）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate hero slides manifest (images/hero/ の中身から自動生成)
        run: node scripts/generate-hero-slides.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 公開に不要なファイル（開発用ツール・下書きページ等）を除いた
      # コピーを作成してからアップロードする
      - name: Prepare deploy directory
        run: |
          mkdir dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='eslint.config.js' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='scripts' \
            --exclude='inProgress' \
            --exclude='.gitignore' \
            --exclude='dist' \
            ./ dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
